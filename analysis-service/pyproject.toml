[project]
name = "innogap-analysis-service"
version = "1.0.0"
description = "InnoGap Dedicated Python FastAPI Analysis Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
